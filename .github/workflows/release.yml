name: Build and Release

on:
  push:
    tags:
      - "creation-texture-v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CreationTexture

    steps:
      # Texture's own CMake (both the CreationSharedLLVM.cmake include and
      # the CREATION_SUITE_SHARED_DIR default) resolves everything shared/
      # as ../../shared relative to itself -- its real layout as an
      # apps/CreationTexture submodule inside the Creation-Suite umbrella
      # repo. Rather than overriding each of those relative paths
      # individually (fragile -- a plain override missed the hardcoded
      # ../../shared/CMake/CreationSharedLLVM.cmake include entirely), CI
      # just reproduces the real nesting: check out the umbrella first for
      # its shared/ tree, then check out this app's own tagged commit into
      # apps/CreationTexture, overwriting the umbrella's empty submodule
      # placeholder. Every relative path then resolves exactly as it does
      # in a real Creation-Suite checkout.
      - name: Checkout Creation Suite umbrella (for shared/)
        uses: actions/checkout@v4
        with:
          repository: wwestlake/Creation-Suite
          ref: claude/development

      - name: Checkout this app at the release tag
        uses: actions/checkout@v4
        with:
          path: apps/CreationTexture

      - name: Fetch JUCE
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.7 https://github.com/juce-framework/JUCE.git "$env:RUNNER_TEMP\JUCE"

      - name: Classify release
        id: classify
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME

          if ($tag -notmatch '^creation-texture-v(?<version>\d+\.\d+\.\d+)(?:-(?<channel>[0-9A-Za-z.-]+))?$') {
            throw "Tag '$tag' must start with creation-texture-v."
          }

          $versionText = $Matches.version
          $explicitChannel = $Matches.channel
          $channel = "stable"
          $prerelease = "false"

          if ($explicitChannel) {
            $channel = $explicitChannel
            $prerelease = "true"
          }
          else {
            $parts = $versionText.Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]

            if ($major -eq 0 -and $minor -lt 5) {
              $channel = "alpha"
              $prerelease = "true"
            }
            elseif ($major -eq 0 -and $minor -ge 5) {
              $channel = "beta"
              $prerelease = "true"
            }
          }

          $suffix = ""
          if ($channel -ne "stable") {
            $suffix = " ($channel)"
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$versionText"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "channel=$channel"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$prerelease"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "suffix=$suffix"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="$env:RUNNER_TEMP\JUCE" "-DCreationTexture_VERSION=${{ steps.classify.outputs.version }}"

      - name: Build app
        shell: pwsh
        run: |
          cmake --build build --config Release --target CreationTextureApp

      - name: Stage release zip
        shell: pwsh
        run: |
          # No install()/CPack packaging is wired up for this app yet -- this
          # zips the raw JUCE build output directly rather than a proper
          # installer layout. Good enough to prove the release pipeline
          # end-to-end; revisit once the app is further along.
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $artefactsDir = "build\CreationTextureApp_artefacts\Release"
          $exe = Get-ChildItem $artefactsDir -Recurse -File | Where-Object { $_.Extension -eq '.exe' } | Select-Object -First 1
          if (-not $exe) {
            throw "Could not find the built Creation Texture executable in $artefactsDir."
          }

          $zipName = Join-Path $PWD ("artifacts\{0}.zip" -f "${{ steps.classify.outputs.tag }}")
          if (Test-Path $zipName) {
            Remove-Item $zipName -Force
          }

          Compress-Archive -Path (Join-Path $artefactsDir "*") -DestinationPath $zipName -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-creation-texture
          path: apps/CreationTexture/artifacts/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Creation Texture ${{ steps.classify.outputs.version }}${{ steps.classify.outputs.suffix }}
          prerelease: ${{ steps.classify.outputs.prerelease }}
          files: apps/CreationTexture/artifacts/*
